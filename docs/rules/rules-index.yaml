# Metadata for each rule file
# Manages overview, tags, typical usage scenarios, and size for each rule

rules:
  # Core Project Rules
  project-context:
    file: "project-context.md"
    tags: [context, project-specific, implementation, forex, trading, multi-broker, real-time]
    typical-use: "Forex trading platform context, multi-broker integration requirements, real-time data synchronization constraints, regulatory compliance considerations"
    size: small
    key-references:
      - "Project-specific (forex trading platform)"
    sections:
      - "Project Overview"
      - "Development Structure"
      - "Business Constraints"
      - "Implementation Principles"

  documentation-criteria:
    file: "documentation-criteria.md"
    tags: [documentation, adr, prd, design-doc, work-plan, decision-matrix, file-count-calculation, type-complexity-matrix, architecture-examples, state-counting, async-coordination, ux-impact-levels, scope-estimation, uxrd]
    typical-use: "File count calculation (new + modified, exclude read-only/tests/auto-generated, edge cases: refactor=1, co-located=1), ADR triggers quantified (type complexity 5 metrics with Low/Medium/High bands, architecture changes 6 YES examples, state counting 3+ distinct conditions, async coordination 5+ processes), UX impact classification (Major: user journey/navigation, Medium: component behavior/layout, Minor: visual-only), scope estimation workflow (4 steps, 5-11 minutes: list changes → count files → check ADR conditions → apply matrix), document creation decision matrix (1-2 files none, 3-5 Design Doc + Work Plan, 6+ ADR + Design Doc + Work Plan)"
    size: medium
    key-references:
      - "ADR Methodology - Michael Nygard"
      - "Design Doc Culture - Google Engineering Practices"
      - "Single Source of Truth"
      - "UXRD - User Experience Requirements"
    sections:
