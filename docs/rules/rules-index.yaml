  # Frontend Architecture Rules
  frontend-data-flow:
    file: "architecture/frontend-data-flow.md"
    tags: [frontend, architecture, data-flow, zustand, useshallow, multiple-stores, performance, react, unidirectional-flow, cross-store]
    typical-use: "Unidirectional data flow with Zustand, useShallow for 60% fewer re-renders (multiple properties), direct selectors for single properties, multiple domain stores (Auth/Canvas/Elements/History separation), cross-store communication (Direct/Subscription/Coordinator/EventBus patterns), immutable updates (manual spreads for shallow, Immer for deep)"
